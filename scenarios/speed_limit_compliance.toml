# Declared against format version 1.0, the original document shape, to keep an
# older scenario in the shipped suite. It loads unchanged and receives the
# default noise free perception model. A 1.0 document may not carry the
# [perception] table introduced in 1.1; the parser rejects it by name.
format_version = "1.0"
name = "speed_limit_compliance"
description = "Ego is configured to want 20 m/s on a 13.9 m/s road and must respect the limit."
expected_outcome = "pass"
dt = 0.05
seed = 1

[road]
kind = "straight"
lanes = 1
lane_width = 3.5
length = 400.0
speed_limit = 13.9

[ego]
lane = 0
s = 0.0
speed = 10.0
controller = "idm_lane_keep"

[ego.longitudinal]
desired_speed = 20.0
max_accel = 1.8
comfort_decel = 2.0

[termination]
max_time = 20.0
goal_s = 240.0

[[assert]]
kind = "speed_limit"
limit = 13.9
tolerance = 0.1

[[assert]]
kind = "longitudinal_acceleration"
minimum = -3.0
maximum = 2.0

[[assert]]
kind = "no_collision"

[[assert]]
kind = "goal_reached"
goal_s = 240.0
time_budget = 19.5
