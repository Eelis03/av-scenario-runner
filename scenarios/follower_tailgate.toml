# A reactive vehicle follows the ego closely while a slower lead forces the ego
# to decelerate. Exercises a rear conflict, which a forward only metric misses.
format_version = "1.1"
name = "follower_tailgate"
description = "Reactive follower tailgates the ego while a slower lead forces the ego to brake."
expected_outcome = "pass"
dt = 0.05
seed = 1

[road]
kind = "straight"
lanes = 2
lane_width = 3.5
length = 400.0
speed_limit = 13.9

[ego]
lane = 0
s = 60.0
speed = 13.0
controller = "idm_lane_keep"

[ego.longitudinal]
desired_speed = 13.9
time_gap = 1.5
min_gap = 2.0
max_accel = 1.4
comfort_decel = 2.0

[[actor]]
id = "lead"
lane = 0
s = 110.0
speed = 13.0
behaviour = "scripted"
schedule = [{ time = 0.0, accel = 0.0 }, { time = 3.0, accel = -2.0 }, { time = 7.0, accel = 0.0 }]

[[actor]]
id = "follower"
lane = 0
s = 35.0
speed = 13.0
behaviour = "reactive"
reactive = { desired_speed = 14.5, time_gap = 0.9, min_gap = 2.0, max_accel = 1.6, comfort_decel = 2.5, max_decel = 8.0 }

[termination]
max_time = 20.0

[[assert]]
kind = "no_collision"

[[assert]]
kind = "min_distance"
threshold = 0.5

[[assert]]
kind = "min_time_to_collision"
threshold = 1.2

[[assert]]
kind = "longitudinal_acceleration"
minimum = -3.5
maximum = 2.0

[[assert]]
kind = "speed_limit"
tolerance = 0.1
